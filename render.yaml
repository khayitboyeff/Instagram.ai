```yaml
services:
  # BACKEND API
  - type: web
    name: insta-ai-studio-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_USERNAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # FRONTEND STATIC SITE
  - type: web
    name: insta-ai-studio-frontend
    runtime: static
    plan: free
    buildCommand: echo "Frontend tayyor"
    staticPublishPath: ./frontend
