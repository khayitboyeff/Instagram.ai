services:
  - type: web
    name: insta-ai-studio-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    disk:
      name: insta-ai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STORAGE_ROOT
        value: /var/data
      - key: HOST
        value: 0.0.0.0
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_USERNAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
